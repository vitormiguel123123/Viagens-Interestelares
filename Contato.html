<h2 class="deixe" align="center">Entre em contato</h2>
      <hr>
      <div class="card">
        <div class="card-body">
		<form>
<form>
 
<div class="mb-3">
<input
type="text"
id="nome"
name="nome"
class="form-control"
placeholder="Nome"
required
minlength="3"
maxlength="50">
</div>
 
<div class="mb-3">
<input
type="email"
id="email"
name="email"
class="form-control"
placeholder="E-mail"
required>
</div>
 
<div class="mb-3">
<input
type="tel"
id="numb"
name="numb"
class="form-control"
placeholder="Número de telefone"
required
minlength="11">
</div>
 
<div class="mb-3">
<p style="text-align: left;">Avalie nosso website:</p>

<select
class="form-select"
id="aval"
name="aval"
required>
 
<option value="" selected disabled>
Selecione uma nota
</option>
 
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
 
</select>
</div>
 
<style>
textarea{
resize:none;
}
</style>
 
<div class="mb-3">
<textarea
class="form-control"
id="floatingTextarea2"
name="opinion"
placeholder="Deixe seu comentário"
style="height:300px"
required></textarea>
</div>
 
<button type="submit" class="btn btn-primary">
Enviar
</button>
